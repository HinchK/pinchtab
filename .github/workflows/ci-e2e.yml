name: CI / E2E

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'skills/**'
      - 'plugin/**'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - cli
          - infra
          - smoke


jobs:
  detect-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run_api_extended: ${{ steps.changes.outputs.run_api_extended }}
      run_cli_extended: ${{ steps.changes.outputs.run_cli_extended }}
      run_infra_extended: ${{ steps.changes.outputs.run_infra_extended }}
      run_smoke: ${{ steps.changes.outputs.run_smoke }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide which suites this diff needs
        id: changes
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD |
            ./scripts/ci/detect-e2e-suites.sh >> "$GITHUB_OUTPUT"

  api:
    needs: [detect-changes]
    if: >-
      always() &&
      (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'api')
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: api
      summary_title: E2E API Tests
      timeout_minutes: 15

  api-extended-pr:
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.run_api_extended == 'true'
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: api-extended
      summary_title: E2E API Extended Tests (PR)
      timeout_minutes: 20

  cli:
    needs: [detect-changes]
    if: >-
      always() &&
      (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'cli')
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: cli
      summary_title: E2E CLI Tests
      timeout_minutes: 15

  cli-extended-pr:
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.run_cli_extended == 'true'
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: cli-extended
      summary_title: E2E CLI Extended Tests (PR)
      timeout_minutes: 20

  infra:
    needs: [detect-changes]
    if: >-
      always() &&
      (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'infra')
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: infra
      summary_title: E2E Infra Tests
      timeout_minutes: 15

  infra-extended-pr:
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.run_infra_extended == 'true'
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: infra-extended
      summary_title: E2E Infra Extended Tests (PR)
      timeout_minutes: 25

  smoke-pr:
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.run_smoke == 'true'
    uses: ./.github/workflows/reusable-smoke.yml
    with:
      ref: ${{ github.sha }}

  # Extended suites for manual dispatch
  api-extended:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'api')
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: api-extended
      summary_title: E2E API Extended Tests
      timeout_minutes: 20

  cli-extended:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'cli')
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: cli-extended
      summary_title: E2E CLI Extended Tests
      timeout_minutes: 20

  infra-extended:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'infra')
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      ref: ${{ github.sha }}
      suite: infra-extended
      summary_title: E2E Infra Extended Tests
      timeout_minutes: 25

  smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'smoke')
    uses: ./.github/workflows/reusable-smoke.yml
    with:
      ref: ${{ github.sha }}
